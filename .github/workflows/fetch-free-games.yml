name: Fetch Epic Free Games

on:
  schedule:
    - cron: "0 16 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch free games list
        run: |
          curl -s https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions \
            | jq '[.data.Catalog.searchStore.elements[] 
                   | select(.price.totalPrice.discountPrice == 0)]' \
            > free_games.json

      - name: Build FREE_GAMES.md with full metadata
        run: |
          echo "# Current Free Epic Games" > FREE_GAMES.md
          echo "" >> FREE_GAMES.md

          USD_TO_AUD=1.50
          USD_TO_GBP=0.78
          USD_TO_EUR=0.92

          jq -c '.[]' free_games.json | while read -r game; do
            title=$(echo "$game" | jq -r '.title')
            desc=$(echo "$game" | jq -r '.description')

            slug=$(echo "$game" | jq -r '.productSlug // .urlSlug // empty')
            link="https://store.epicgames.com/p/$slug"

            developer=$(echo "$game" | jq -r '.seller.name // "Unknown Developer"')

            original_price=$(echo "$game" | jq -r '.price.totalPrice.originalPrice')
            usd=$(printf "%.2f" "$(echo "$original_price / 100" | bc -l)")
            aud=$(printf "%.2f" "$(echo "$usd * $USD_TO_AUD" | bc -l)")
            gbp=$(printf "%.2f" "$(echo "$usd * $USD_TO_GBP" | bc -l)")
            eur=$(printf "%.2f" "$(echo "$usd * $USD_TO_EUR" | bc -l)")

            # Catalog ID (always exists)
            catalog_id=$(echo "$game" | jq -r '.id')

            # Fetch full metadata from products/v2 API
            metadata=$(curl -s "https://store.epicgames.com/api/products/v2?storeId=${catalog_id}")

            # Skip if metadata is not valid JSON
            if ! echo "$metadata" | jq empty 2>/dev/null; then
              echo "Skipping $title (metadata not JSON)"
              continue
            fi

            # Extract metadata fields
            publisher=$(echo "$metadata" | jq -r '.data.publisher // "Unknown Publisher"')
            release_raw=$(echo "$metadata" | jq -r '.data.releaseDate // empty')
            release_date=$(date -d "$release_raw" +"%B %d, %Y" 2>/dev/null || echo "$release_raw")

            genres=$(echo "$metadata" | jq -r '.data.genres[].name' 2>/dev/null | paste -sd ", " -)
            if [ -z "$genres" ]; then genres="Unknown"; fi

            platforms=$(echo "$metadata" | jq -r '.data.platforms[].name' 2>/dev/null | paste -sd ", " -)
            if [ -z "$platforms" ]; then platforms="Unknown"; fi

            age_rating=$(echo "$metadata" | jq -r '.data.ageRating // "Not Rated"')

            img=$(echo "$game" | jq -r '.keyImages[0].url')

            {
              echo "## [$title — \$${usd} USD; \$${aud} AUD; £${gbp} GBP; €${eur} EUR]($link)"
              echo "#### *By $developer*"
              echo "#### *Genre: $genres*"
              echo "#### *Release Date: $release_date*"
              echo "#### *Publisher: $publisher*"
              echo "#### *Platforms: $platforms*"
              echo "#### *Age Rating: $age_rating*"
              echo ""
              echo "[![$title]($img)]($link)"
              echo ""
              echo "$desc"
              echo ""
              echo "---"
              echo ""
            } >> FREE_GAMES.md
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add FREE_GAMES.md free_games.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use products/v2 metadata API; full metadata + multi-currency prices"
            git push
          fi
