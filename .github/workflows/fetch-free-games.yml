name: Fetch Epic Free Games

on:
  schedule:
    # Epic refreshes free games every Thursday at ~15:00 UTC
    # This runs at 16:00 UTC — one hour after the refresh
    - cron: "0 16 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch free games JSON (array output)
        run: |
          curl -s https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions \
            | jq '[.data.Catalog.searchStore.elements[] 
                   | select(.price.totalPrice.discountPrice == 0)]' \
            > free_games.json

      - name: Convert JSON → Markdown (full metadata)
        run: |
          echo "# Current Free Epic Games" > FREE_GAMES.md
          echo "" >> FREE_GAMES.md

          jq -c '.[]' free_games.json | while read -r game; do
            title=$(echo "$game" | jq -r '.title')
            desc=$(echo "$game" | jq -r '.description')

            # Correct public store slug
            slug=$(echo "$game" | jq -r '.catalogNs.mappings[0].pageSlug // empty')
            if [ -z "$slug" ]; then
              slug=$(echo "$game" | jq -r '.urlSlug // .productSlug // empty')
            fi

            link="https://store.epicgames.com/p/$slug"
            img=$(echo "$game" | jq -r '.keyImages[0].url')

            # Developer
            developer=$(echo "$game" | jq -r '.seller.name // "Unknown Developer"')

            # Publisher
            publisher=$(echo "$game" | jq -r '.publisherName // "Unknown Publisher"')

            # Price (Epic stores prices in cents)
            original_price=$(echo "$game" | jq -r '.price.totalPrice.originalPrice')
            price=$(printf "$%.2f" "$(echo "$original_price / 100" | bc -l)")

            # Release date
            release_raw=$(echo "$game" | jq -r '.effectiveDate')
            release_date=$(date -d "$release_raw" +"%B %d, %Y" 2>/dev/null || echo "$release_raw")

            # Genres (tags)
            genres=$(echo "$game" | jq -r '.tags[].name' | paste -sd ", " -)
            if [ -z "$genres" ]; then genres="Unknown"; fi

            # Supported platforms
            platforms=$(echo "$game" | jq -r '.supportedPlatforms[]' | paste -sd ", " -)
            if [ -z "$platforms" ]; then platforms="Unknown"; fi

            # Age rating
            age_rating=$(echo "$game" | jq -r '.ageGatings[0].rating // "Not Rated"')

            {
              echo "## [$title — $price]($link)"
              echo "#### *By $developer*"
              echo "#### *Genre: $genres*"
              echo "#### *Release Date: $release_date*"
              echo "#### *Publisher: $publisher*"
              echo "#### *Platforms: $platforms*"
              echo "#### *Age Rating: $age_rating*"
              echo ""
              echo "[![$title]($img)]($link)"
              echo ""
              echo "$desc"
              echo ""
              echo "---"
              echo ""
            } >> FREE_GAMES.md
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add FREE_GAMES.md free_games.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add genre, release date, publisher, platforms, and age rating to FREE_GAMES.md cards"
            git push
          fi
