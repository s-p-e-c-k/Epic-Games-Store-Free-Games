name: Fetch Epic Free Games

on:
  schedule:
    - cron: "0 0 * * 4"   # Every Thursday UTC (Epic refresh day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch free games JSON
        run: |
          curl -s https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions \
            | jq '.data.Catalog.searchStore.elements[] 
                  | select(.price.totalPrice.discountPrice == 0)' \
            > free_games.json

      - name: Convert JSON → Markdown (rich cards)
        run: |
          echo "# Current Free Epic Games" > FREE_GAMES.md
          echo "" >> FREE_GAMES.md

          jq -c '.[]' free_games.json | while read -r game; do
            title=$(echo "$game" | jq -r '.title')
            desc=$(echo "$game" | jq -r '.description')
            slug=$(echo "$game" | jq -r '.urlSlug // .productSlug // empty')
            img=$(echo "$game" | jq -r '.keyImages[0].url')

            # Build Epic store link
            link="https://store.epicgames.com/p/$slug"

            {
              echo "## $title"
              echo "[![$title]($img)]($link)"
              echo ""
              echo "$desc"
              echo ""
              echo "---"
              echo ""
            } >> FREE_GAMES.md
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add FREE_GAMES.md free_games.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Updated free Epic Games list (rich cards)"
            git push
          fi
