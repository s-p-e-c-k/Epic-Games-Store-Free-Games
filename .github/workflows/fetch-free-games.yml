name: Fetch Epic Free Games

on:
  schedule:
    # Epic refreshes free games every Thursday at ~15:00 UTC
    # This runs at 16:00 UTC — one hour after the refresh
    - cron: "0 16 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-free-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch free games JSON (array output)
        run: |
          curl -s https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions \
            | jq '[.data.Catalog.searchStore.elements[] 
                   | select(.price.totalPrice.discountPrice == 0)]' \
            > free_games.json

      - name: Convert JSON → Markdown (rich cards with linked titles)
        run: |
          echo "# Current Free Epic Games" > FREE_GAMES.md
          echo "" >> FREE_GAMES.md

          jq -c '.[]' free_games.json | while read -r game; do
            title=$(echo "$game" | jq -r '.title')
            desc=$(echo "$game" | jq -r '.description')
            slug=$(echo "$game" | jq -r '.urlSlug // .productSlug // empty')
            img=$(echo "$game" | jq -r '.keyImages[0].url')

            link="https://store.epicgames.com/p/$slug"

            {
              echo "## [$title]($link)"
              echo "[![$title]($img)]($link)"
              echo ""
              echo "$desc"
              echo ""
              echo "---"
              echo ""
            } >> FREE_GAMES.md
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add FREE_GAMES.md free_games.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make game titles clickable links to their Epic Store pages in FREE_GAMES.md"
            git push
          fi
